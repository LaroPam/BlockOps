[package]
name = "blockops-desktop"
version = "0.1.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
blockops-tunnel = { path = "../../../crates/tunnel" }
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blockops-server-manager = { path = "../../../crates/server-manager" }
tauri-plugin-opener = "2"
blockops-coordination = { path = "../../../crates/coordination" }
