plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = 'org.blockops'
base { archivesName = "blockops-neoforge-${project.minecraft_version}" }

// The bridge, publisher and private descriptor are shared by every loader and version.
sourceSets.main.java.srcDir '../common/src/main/java'

neoForge {
    version = project.neo_version
    mods {
        blockops {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft', project.minecraft_version
    filesMatching(['META-INF/neoforge.mods.toml', 'blockops.json']) {
        expand version: project.version, loader: 'neoforge', minecraft: project.minecraft_version
    }
}
