plugins {
    id 'fabric-loom' version '1.7.4'
}

version = project.mod_version
group = 'org.blockops'

loom {
    splitEnvironmentSourceSets()
    mods {
        blockops {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Plain executable checks: no test framework, Minecraft runtime or internet access.
def bridgeChecks = [
    localBridgeTest: 'org.blockops.bridge.LocalJoinBridgeTest',
    discoveryPublisherTest: 'org.blockops.bridge.DiscoveryPublisherTest',
    windowsDescriptorTest: 'org.blockops.bridge.WindowsDescriptorFileTest',
]
bridgeChecks.each { name, main ->
    tasks.register(name, JavaExec) {
        dependsOn testClasses
        // The Windows writer uses JNA from Minecraft's libraries, absent from the test runtime.
        classpath = sourceSets.test.runtimeClasspath + sourceSets.main.runtimeClasspath
        mainClass = main
    }
    tasks.named('check') { dependsOn tasks.named(name) }
}
