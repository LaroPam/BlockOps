[workspace]
members = ["crates/tunnel", "crates/relay", "crates/server-manager", "crates/coordination", "crates/local-discovery"]
exclude = ["apps/desktop/src-tauri"]
resolver = "2"

[workspace.dependencies]
libp2p = { version = "0.56", features = ["tokio", "tcp", "quic", "dns", "noise", "yamux", "relay", "identify", "dcutr", "kad", "ping", "rsa", "macros"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
