name: checks
on: [push, pull_request]
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - run: python scripts/coordination_smoke.py
      - name: HTTPS pilot smoke test
        if: runner.os == 'Linux'
        run: python scripts/https_pilot_smoke.py
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - run: npm run tauri -w apps/desktop -- build --ci
      - name: Smoke test NSIS install and uninstall
        shell: pwsh
        run: .github/scripts/windows-installer-smoke.ps1
      - name: Upload unsigned installer for review
        uses: actions/upload-artifact@v4
        with:
          name: blockops-windows-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
