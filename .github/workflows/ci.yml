name: checks
on: [push, pull_request]
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - name: Clippy (Linux)
        if: runner.os != 'Windows'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | Tee-Object -Variable clippyOutput | Out-Host
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $detail = (($clippyOutput | Select-Object -Last 80) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows Clippy::$detail"
            exit $result
          }
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - run: python scripts/coordination_smoke.py
      - name: HTTPS pilot smoke test
        if: runner.os == 'Linux'
        run: python scripts/https_pilot_smoke.py
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - run: npm run tauri -w apps/desktop -- build --ci
      - name: Smoke test NSIS install and uninstall
        shell: pwsh
        run: .github/scripts/windows-installer-smoke.ps1
      - name: Upload unsigned installer for review
        uses: actions/upload-artifact@v4
        with:
          name: blockops-windows-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
