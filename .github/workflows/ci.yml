name: checks
on: [push, pull_request]
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - name: Clippy (Linux)
        if: runner.os != 'Windows'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | Tee-Object -Variable clippyOutput | Out-Host
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $detail = (($clippyOutput | Select-Object -Last 80) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows Clippy::$detail"
            exit $result
          }
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - name: Coordination smoke (Linux)
        if: runner.os != 'Windows'
        run: python scripts/coordination_smoke.py
      - name: Coordination smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          python scripts/coordination_smoke.py 2>&1 | Tee-Object -Variable smokeOutput | Out-Host
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $detail = (($smokeOutput | Select-Object -Last 80) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows coordination smoke::$detail"
            exit $result
          }
      - name: HTTPS pilot smoke test
        if: runner.os == 'Linux'
        run: python scripts/https_pilot_smoke.py
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # The installer ships the mod so the application can install it on request.
      - name: Build the bundled Fabric mod
        working-directory: mods/fabric-1.21.1
        run: .\gradlew.bat --no-daemon assemble
      - name: Bundle the mod with the desktop application
        run: Copy-Item mods/fabric-1.21.1/build/libs/blockops-fabric-client-*.jar apps/desktop/src-tauri/resources/mod/
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:ui -w apps/desktop
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - run: npm run tauri -w apps/desktop -- build --ci
      - name: Smoke test install, window startup and uninstall
        shell: pwsh
        run: |
          try { .github/scripts/windows-installer-smoke.ps1 }
          catch {
            $detail = $_.Exception.Message.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows application smoke::$detail"
            throw
          }
      - name: Upload unsigned installer for review
        uses: actions/upload-artifact@v4
        with:
          name: blockops-windows-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
  fabric-client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mods/fabric-1.21.1
    env:
      # Windows runs the mod's private descriptor writer against the desktop's reader.
      BLOCKOPS_BRIDGE_TEST_CLIENT: ${{ github.workspace }}${{ matrix.os == 'windows-latest' && '\target\debug\examples\local_bridge_smoke.exe' || '/target/debug/examples/local_bridge_smoke' }}
      BLOCKOPS_DISCOVERY_TEST_READER: ${{ github.workspace }}${{ matrix.os == 'windows-latest' && '\target\debug\examples\read_descriptor.exe' || '/target/debug/examples/read_descriptor' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Build local bridge and discovery test clients
        working-directory: .
        run: |
          cargo build -p blockops-coordination --example local_bridge_smoke --locked
          cargo build -p blockops-local-discovery --example read_descriptor --locked
      - name: Build client mod
        if: runner.os != 'Windows'
        run: |
          if ! ./gradlew --no-daemon build > /tmp/blockops-fabric-build.log 2>&1; then
            tail -80 /tmp/blockops-fabric-build.log
            detail=$(tail -40 /tmp/blockops-fabric-build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Fabric build::$detail"
            exit 1
          fi
          tail -40 /tmp/blockops-fabric-build.log
      - name: Build client mod (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          .\gradlew.bat --no-daemon build 2>&1 | Tee-Object -Variable buildOutput | Out-Host
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $detail = (($buildOutput | Select-Object -Last 80) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows Fabric build::$detail"
            exit $result
          }
          if (-not ($buildOutput -match 'Windows descriptor tests passed')) {
            Write-Output "::error title=Windows Fabric build::Windows descriptor tests did not run"
            exit 1
          }
      - name: Check packaged mod contents
        if: runner.os != 'Windows'
        run: |
          jar tf build/libs/blockops-fabric-client-0.1.0.jar > /tmp/blockops-mod-files.txt
          grep -Fx 'fabric.mod.json' /tmp/blockops-mod-files.txt
          grep -Fx 'org/blockops/fabric/BlockOpsClient.class' /tmp/blockops-mod-files.txt
          grep -Fx 'org/blockops/fabric/PairingScreen.class' /tmp/blockops-mod-files.txt
          grep -Fx 'org/blockops/bridge/DiscoveryPublisher.class' /tmp/blockops-mod-files.txt
          grep -Fx 'org/blockops/bridge/WindowsDescriptorFile.class' /tmp/blockops-mod-files.txt
          grep -Fx 'blockops.client.mixins.json' /tmp/blockops-mod-files.txt
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: blockops-fabric-1.21.1-experimental
          path: mods/fabric-1.21.1/build/libs/blockops-fabric-client-0.1.0.jar
          if-no-files-found: error
